<!DOCTYPE html>

<html class="h-full dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LectureNote AI - Processing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed-dim": "#b7c8de",
                      "surface-container": "rgba(30, 41, 59, 0.3)",
                      "on-background": "#f8fafc",
                      "on-primary-fixed": "#0b1d2d",
                      "inverse-surface": "#2e3132",
                      "background": "#020617",
                      "secondary": "#7dd3fc",
                      "on-error": "#ffffff",
                      "on-error-container": "#93000a",
                      "on-surface-variant": "#94a3b8",
                      "on-tertiary-fixed-variant": "#3f484f",
                      "on-primary": "#082f49",
                      "tertiary": "#0e171d",
                      "surface-container-highest": "rgba(51, 65, 85, 0.6)",
                      "error": "#ba1a1a",
                      "on-surface": "#f8fafc",
                      "surface-container-high": "rgba(51, 65, 85, 0.5)",
                      "inverse-primary": "#b7c8de",
                      "on-primary-fixed-variant": "#38485a",
                      "on-secondary-container": "#003e73",
                      "surface-dim": "rgba(15, 23, 42, 0.6)",
                      "on-secondary-fixed-variant": "#004883",
                      "primary": "#7dd3fc",
                      "tertiary-fixed": "#dbe4ed",
                      "surface-tint": "#4f6073",
                      "surface-variant": "rgba(51, 65, 85, 0.4)",
                      "secondary-fixed-dim": "#a4c9ff",
                      "surface": "rgba(15, 23, 42, 0.5)",
                      "secondary-fixed": "#d4e3ff",
                      "error-container": "#ffdad6",
                      "primary-fixed": "#d2e4fb",
                      "outline": "#64748b",
                      "outline-variant": "rgba(148, 163, 184, 0.15)",
                      "on-tertiary-fixed": "#141d23",
                      "on-tertiary": "#ffffff",
                      "on-primary-container": "#8192a7",
                      "surface-container-low": "rgba(30, 41, 59, 0.2)",
                      "on-tertiary-container": "#89929b",
                      "on-secondary": "#082f49",
                      "tertiary-fixed-dim": "#bfc8d0",
                      "tertiary-container": "#222b32",
                      "inverse-on-surface": "#f0f1f2",
                      "surface-container-lowest": "rgba(2, 6, 23, 0.5)",
                      "on-secondary-fixed": "#001c39",
                      "secondary-container": "rgba(125, 211, 252, 0.1)",
                      "surface-bright": "rgba(51, 65, 85, 0.8)",
                      "primary-container": "rgba(125, 211, 252, 0.1)"
              },
              "borderRadius": {
                      "DEFAULT": "0.75rem",
                      "lg": "0.75rem",
                      "xl": "1rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "16px",
                      "gutter": "24px",
                      "container-max-width": "1200px",
                      "unit": "8px",
                      "margin-desktop": "40px"
              },
              "fontFamily": {
                      "h1-desktop": ["Inter"],
                      "h3": ["Inter"],
                      "h1-mobile": ["Inter"],
                      "label-sm": ["Inter"],
                      "body-md": ["Inter"],
                      "h2": ["Inter"],
                      "caption": ["Inter"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "h1-desktop": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "h3": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                      "h1-mobile": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "label-sm": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "h2": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "caption": ["13px", {"lineHeight": "1.4", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        .progress-line {
            transition: height 0.5s ease-in-out;
        }
        .pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(125, 211, 252, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(125, 211, 252, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(125, 211, 252, 0); }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-full flex flex-col font-body-md antialiased selection:bg-secondary/30 selection:text-secondary bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-background to-background">
<!-- Top Navigation (Shell Suppressed per Rules for Transactional/Processing Screen) -->
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-[600px] bg-surface/80 backdrop-blur-xl border border-outline-variant/30 rounded-xl p-8 md:p-12 shadow-[0_8px_32px_0_rgba(0,0,0,0.3)]">
<!-- Header -->
<div class="text-center mb-12">
<h1 class="font-h1-mobile md:font-h1-desktop text-h1-mobile md:text-h1-desktop text-primary mb-2 drop-shadow-sm">Preparing your study material</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">This may take a few moments. Please do not close this window.</p>
</div>
<!-- Vertical Progress Timeline -->
<div class="relative pl-4 md:pl-8">
<!-- Line background -->
<div class="absolute left-6 md:left-10 top-2 bottom-2 w-px bg-outline-variant"></div>
<!-- Active progress line (simulation) -->
<div class="absolute left-6 md:left-10 top-2 w-px bg-secondary progress-line shadow-[0_0_8px_rgba(125,211,252,0.8)]" style="height: 50%;"></div>
<!-- Step 1: Completed -->
<div class="relative flex items-start mb-8 group">
<div class="absolute -left-2 md:-left-2 mt-1 w-6 h-6 rounded-full bg-secondary flex items-center justify-center border-2 border-surface/50 backdrop-blur-sm z-10 shadow-[0_0_10px_rgba(125,211,252,0.5)]">
<span class="material-symbols-outlined text-on-primary text-[14px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="ml-10">
<h3 class="font-h3 text-h3 text-on-surface">Lecture uploaded</h3>
<p class="font-caption text-caption text-on-surface-variant mt-1">Complete</p>
</div>
</div>
<!-- Step 2: Completed -->
<div class="relative flex items-start mb-8 group">
<div class="absolute -left-2 md:-left-2 mt-1 w-6 h-6 rounded-full bg-secondary flex items-center justify-center border-2 border-surface/50 backdrop-blur-sm z-10 shadow-[0_0_10px_rgba(125,211,252,0.5)]">
<span class="material-symbols-outlined text-on-primary text-[14px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="ml-10">
<h3 class="font-h3 text-h3 text-on-surface">Converting speech to text</h3>
<p class="font-caption text-caption text-on-surface-variant mt-1">Complete</p>
</div>
</div>
<!-- Step 3: In Progress -->
<div class="relative flex items-start mb-8 group">
<div class="absolute -left-2 md:-left-2 mt-1 w-6 h-6 rounded-full bg-surface-container border-2 border-secondary flex items-center justify-center z-10 pulse backdrop-blur-md">
<div class="w-2 h-2 rounded-full bg-secondary shadow-[0_0_8px_rgba(125,211,252,1)]"></div>
</div>
<div class="ml-10">
<h3 class="font-h3 text-h3 text-primary font-bold drop-shadow-[0_0_8px_rgba(125,211,252,0.3)]">Organizing lecture content</h3>
<p class="font-caption text-caption text-secondary mt-1">Processing...</p>
</div>
</div>
<!-- Step 4: Pending -->
<div class="relative flex items-start mb-8 group opacity-40">
<div class="absolute -left-2 md:-left-2 mt-1 w-6 h-6 rounded-full bg-surface-container border-2 border-outline-variant flex items-center justify-center z-10 backdrop-blur-md">
</div>
<div class="ml-10">
<h3 class="font-h3 text-h3 text-on-surface-variant">Generating study notes</h3>
<p class="font-caption text-caption text-outline mt-1">Pending</p>
</div>
</div>
<!-- Step 5: Pending -->
<div class="relative flex items-start group opacity-40">
<div class="absolute -left-2 md:-left-2 mt-1 w-6 h-6 rounded-full bg-surface-container border-2 border-outline-variant flex items-center justify-center z-10 backdrop-blur-md">
</div>
<div class="ml-10">
<h3 class="font-h3 text-h3 text-on-surface-variant">Creating quiz &amp; flashcards</h3>
<p class="font-caption text-caption text-outline mt-1">Pending</p>
</div>
</div>
</div>
<!-- Cancel Button (Secondary Action) -->
<div class="mt-12 text-center">
<button class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all duration-300 py-2 px-6 border border-outline-variant/30 rounded-xl bg-surface-container/30 hover:bg-surface-variant/50 backdrop-blur-md hover:border-outline-variant/60">
                    Cancel Processing
                </button>
</div>
</div>
</main>
<!-- Footer (Shell Suppressed per Rules for Transactional/Processing Screen) -->
</body></html>
